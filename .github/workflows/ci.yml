name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Basic checks and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Check Go dependencies and code
        run: |
          go mod verify
          go vet ./...
          go test ./... -count=1 -timeout=120s
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in src/web/*.js internal/server/*.cjs scripts/*.cjs; do
            node --check "$file"
          done
      - name: Build smoke executable
        run: go build -trimpath -ldflags "-X main.version=ci" -o bin/zcode2api .
      - name: Smoke test local service
        run: node scripts/smoke.cjs bin/zcode2api ci
