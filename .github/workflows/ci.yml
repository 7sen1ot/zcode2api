name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'

jobs:
  checks:
    name: Source and build checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Check Go dependencies and code
        run: |
          go mod verify
          go vet ./...
      - name: Check JavaScript syntax
        shell: bash
        run: |
          shopt -s globstar nullglob
          for file in src/web/*.js internal/server/**/*.cjs scripts/*.cjs; do
            node --check "$file"
          done
      - name: Build executable
        run: go build -trimpath -ldflags "-X main.version=ci" -o bin/zcode2api .
      - name: Run integration tests without a browser
        env:
          ZCODE2API_TEST_BINARY: ${{ github.workspace }}/bin/zcode2api
        run: go test -v -count=1 -timeout=5m ./test

  scheduled-claim:
    name: Scheduled claim with Chromium
    # Playwright 1.58.2 provides a headless shell for Ubuntu 24.04 x64.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install headless Chromium for scheduled claims
        run: |
          npm install --prefix "$RUNNER_TEMP/claim-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.58.2
          "$RUNNER_TEMP/claim-browser/node_modules/.bin/playwright-core" install --with-deps --only-shell chromium
      - name: Test scheduled daily card claim
        env:
          NODE_PATH: ${{ runner.temp }}/claim-browser/node_modules
        run: go test -v -tags=browser -run '^TestScheduledDailyCardClaim$' -count=1 -timeout=5m ./test
